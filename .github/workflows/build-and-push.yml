name: build-and-push

on:
  push:
    branches: [main, ffmpeg-test]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag suffix (only "latest" on main)
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "moving_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ github.ref_name == 'main' && 'Dockerfile' || 'Dockerfile.ffmpeg' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.moving_tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}